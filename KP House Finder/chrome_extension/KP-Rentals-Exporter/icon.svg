<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd16b"/>
      <stop offset="0.55" stop-color="#ff9a52"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19c6c9"/>
      <stop offset="1" stop-color="#0a9aa8"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="64" cy="50" r="17" fill="#fff3c4" opacity="0.95"/>

  <!-- sea band -->
  <rect x="0" y="86" width="128" height="42" fill="url(#sea)"/>
  <rect x="0" y="86" width="128" height="42" fill="none"/>
  <!-- subtle wave line -->
  <path d="M0 96 q16 -6 32 0 t32 0 t32 0 t32 0" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.35"/>

  <!-- sand -->
  <path d="M0 110 q32 -10 64 0 t64 0 V128 H0 Z" fill="#f6e2b3"/>

  <!-- left palm tree -->
  <g>
    <path d="M26 108 q-3 -22 4 -38" stroke="#7a4a22" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g fill="#2e8b57">
      <path d="M30 70 q-20 -6 -28 4 q16 -2 28 2 Z"/>
      <path d="M30 70 q20 -6 28 4 q-16 -2 -28 2 Z"/>
      <path d="M30 70 q-8 -22 -22 -24 q10 12 16 28 Z"/>
      <path d="M30 70 q8 -22 22 -24 q-10 12 -16 28 Z"/>
      <path d="M30 70 q-2 -24 2 -30 q4 8 4 30 Z"/>
    </g>
  </g>

  <!-- house -->
  <g>
    <!-- body -->
    <rect x="46" y="74" width="44" height="34" rx="3" fill="#fffaf2"/>
    <!-- roof -->
    <path d="M42 76 L68 54 L94 76 Z" fill="#e7553c"/>
    <!-- door -->
    <rect x="62" y="88" width="12" height="20" rx="2" fill="#6b4a8a"/>
    <!-- window -->
    <rect x="50" y="82" width="9" height="9" rx="1.5" fill="#7ec8e3"/>
    <rect x="77" y="82" width="9" height="9" rx="1.5" fill="#7ec8e3"/>
  </g>

  <!-- right palm tree (smaller) -->
  <g>
    <path d="M104 110 q3 -18 -3 -30" stroke="#7a4a22" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="#2e8b57">
      <path d="M101 80 q16 -5 22 3 q-13 -2 -22 1 Z"/>
      <path d="M101 80 q-16 -5 -22 3 q13 -2 22 1 Z"/>
      <path d="M101 80 q6 -18 18 -19 q-9 10 -13 22 Z"/>
      <path d="M101 80 q-6 -18 -18 -19 q9 10 13 22 Z"/>
    </g>
  </g>
</svg>
